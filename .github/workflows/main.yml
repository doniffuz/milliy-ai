name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Extract MILLIY AI
        run: |
          set -e
          ZIP="MILLIY_AI_FULLSTACK_FIXED_v6.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP topilmadi: $ZIP"
            ls -lah
            exit 1
          fi

          mkdir -p app
          unzip -o "$ZIP" -d app

      - name: Find Flutter project
        run: |
          set -e

          PUBSPEC=$(find app -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml topilmadi!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android --project-name milliy_ai .

      - name: Set Android NDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'ndkVersion = "27.0.12077973"' not in s:
              s = s.replace(
                  "android {\n",
                  'android {\n    ndkVersion = "27.0.12077973"\n',
                  1
              )

          p.write_text(s)
          PY

      - name: Set application name
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n'
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  "<application",
                  1
              )

          s = s.replace(
              'android:label="milliy_ai"',
              'android:label="Milliy AI"'
          )

          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Milliy-AI-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter clean || true
          rm -rf android
          flutter create --platforms=android --project-name=milliy_ai .

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
