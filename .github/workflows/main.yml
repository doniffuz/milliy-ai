name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MILLIY AI APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # ==========================================
      # 4. Flutter loyihasini topish
      #    Rootda yoki ZIP ichida bo'lishi mumkin
      # ==========================================
      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Repository tarkibi"
          echo "======================================"
          ls -lah

          # Rootda pubspec.yaml bormi?
          if [ -f "pubspec.yaml" ]; then
            echo "Flutter project rootda topildi."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Rootda pubspec.yaml yo'q."

          mkdir -p extracted

          ZIP_FILE=""

          # ZIPlarni tekshirish
          while IFS= read -r zip; do
            echo "Tekshirilmoqda: $zip"

            if unzip -l "$zip" 2>/dev/null | grep -q "pubspec.yaml"; then
              ZIP_FILE="$zip"
              break
            fi
          done < <(find . -maxdepth 1 -type f -iname "*.zip" -print)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "XATO: Flutter project topilmadi."
            echo "pubspec.yaml ham, mos ZIP ham topilmadi."
            echo ""
            echo "Repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Flutter ZIP topildi: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" | head -n 1 || true)

          if [ -z "$PUBSPEC" ]; then
            echo "XATO: ZIP ichidan pubspec.yaml topilmadi."
            find extracted -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          # 1-usul
          if [ -n "${ANDROID_HOME:-}" ] && \
             [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          # 2-usul
          if [ -z "$SDKMANAGER" ] && \
             [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          # 3-usul — runner ichidan qidirish
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find \
              /usr/local/lib/android/sdk \
              /opt/android-sdk \
              "$HOME/Android" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "XATO: sdkmanager topilmadi."
            echo "Android SDK joylari:"
            ls -la /usr/local/lib/android/sdk 2>/dev/null || true
            ls -la "$ANDROID_HOME" 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

          echo "Android SDK tayyor."

      # ==========================================
      # 6. Android project yaratish
      # ==========================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "pubspec.yaml" ]; then
            echo "XATO: pubspec.yaml topilmadi."
            exit 1
          fi

          echo "Flutter project:"
          pwd

          echo "Eski Android project olib tashlanmoqda..."
          rm -rf android

          echo "Android project yaratilmoqda..."

          flutter create \
            --platforms=android \
            --project-name=milliy_ai \
            --org=com.example \
            .

      # ==========================================
      # 7. Android konfiguratsiyasi
      # ==========================================
      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "XATO: $FILE topilmadi."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # compileSdk 36
          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              text
          )

          if 'compileSdk = 36' not in text:
              text = text.replace(
                  'android {',
                  'android {\n    compileSdk = 36',
                  1
              )

          # minSdk 24
          text = re.sub(
              r'minSdk\s*=\s*\d+',
              'minSdk = 24',
              text
          )

          text = re.sub(
              r'minSdkVersion\s*=?\s*\d+',
              'minSdk = 24',
              text
          )

          if 'minSdk = 24' not in text:
              text = text.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        minSdk = 24',
                  1
              )

          # NDK 27
          text = re.sub(
              r'ndkVersion\s*=\s*["\'][^"\']+["\']',
              'ndkVersion = "27.0.12077973"',
              text
          )

          if 'ndkVersion = "27.0.12077973"' not in text:
              text = text.replace(
                  'android {',
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          path.write_text(text)

          print("Android konfiguratsiyasi tayyor.")
          PY

          echo "======================================"
          echo "Android sozlamalari"
          echo "======================================"

          grep -E \
            "compileSdk|minSdk|ndkVersion" \
            android/app/build.gradle.kts || true

      # ==========================================
      # 8. Dependencies
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      # ==========================================
      # 9. Analyze
      #    Analyze xatosi APK buildni to'xtatmaydi
      # ==========================================
      - name: Analyze Flutter project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          flutter analyze --no-fatal-infos || true

      # ==========================================
      # 10. Build APK
      # ==========================================
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # ==========================================
      # 11. APKni tekshirish
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find \
            "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "XATO: APK topilmadi."
            echo ""
            echo "Build papkasi:"
            find "$PROJECT_DIR/build" \
              -type f \
              -name "*.apk" \
              2>/dev/null || true
            exit 1
          fi

          echo "======================================"
          echo "APK MUVAFFAQIYATLI YARATILDI"
          echo "======================================"

          ls -lh "$APK"

          mkdir -p final-apk
          cp "$APK" final-apk/MILLIY-AI.apk

      # ==========================================
      # 12. APK Artifact
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: final-apk/MILLIY-AI.apk
          if-no-files-found: error
          retention-days: 30
