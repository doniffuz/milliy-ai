name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Check project
        run: |
          set -e

          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml topilmadi!"
            echo "Repository tarkibi:"
            ls -la
            exit 1
          fi

      - name: Prepare Android
        run: |
          set -e

          flutter create \
            --platforms=android \
            --project-name=milliy_ai \
            --org=com.example \
            .

      - name: Install Firebase configuration
        run: |
          set -e

          if [ ! -f "google-services.json" ]; then
            echo "Root papkada google-services.json topilmadi!"
            exit 1
          fi

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          echo "Firebase configuration o'rnatildi."

      - name: Configure Android
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # SDK
          s = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              s
          )

          # NDK
          if re.search(r'ndkVersion\s*=', s):
              s = re.sub(
                  r'ndkVersion\s*=\s*".*?"',
                  'ndkVersion = "27.0.12077973"',
                  s
              )
          else:
              s = s.replace(
                  'android {',
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          # minSdk
          if re.search(r'minSdk\s*=', s):
              s = re.sub(
                  r'minSdk\s*=\s*\d+',
                  'minSdk = 24',
                  s
              )
          elif re.search(r'minSdkVersion\s+', s):
              s = re.sub(
                  r'minSdkVersion\s+\d+',
                  'minSdkVersion 24',
                  s
              )
          else:
              s = s.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        minSdk = 24',
                  1
              )

          p.write_text(s)
          PY

      - name: Configure Google Services
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          if 'com.google.gms.google-services' not in s:
              marker = 'plugins {'
              if marker in s:
                  s = s.replace(
                      marker,
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )

          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'com.google.gms.google-services' not in s:
              marker = 'plugins {'
              if marker in s:
                  s = s.replace(
                      marker,
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )

          p.write_text(s)
          PY

      - name: Dependencies
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Generate SHA-1
        run: |
          set -e

          echo "=========================================="
          echo "MILLIY AI DEBUG SHA-1"
          echo "=========================================="

          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -list \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              | grep -E "SHA1:|SHA256:"
          else
            echo "Debug keystore topilmadi."
          fi

          echo "=========================================="

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: |
          set -e

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK topilmadi!"
            exit 1
          fi

          echo "APK tayyor:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
