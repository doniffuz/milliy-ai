name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e

          echo "Repository:"
          ls -la

          mkdir -p extracted

          ZIP_FILE=""

          for zip in *.zip; do
            [ -f "$zip" ] || continue

            echo "Tekshirilmoqda: $zip"

            if unzip -l "$zip" | grep -qE '(^|/ )pubspec\.yaml$|pubspec\.yaml'; then
              ZIP_FILE="$zip"
              echo "Flutter loyiha topildi: $ZIP_FILE"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "XATO: pubspec.yaml mavjud bo'lgan ZIP topilmadi!"
            echo "Mavjud ZIP fayllar:"
            ls -lh *.zip 2>/dev/null || true
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "XATO: ZIP ochilgandan keyin pubspec.yaml topilmadi!"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter loyiha:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "platform-tools" \
                     "ndk;27.0.12077973"

      - name: Prepare Flutter project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Flutter loyiha tarkibi:"
          ls -la

          if [ ! -f pubspec.yaml ]; then
            echo "XATO: pubspec.yaml topilmadi!"
            exit 1
          fi

          flutter clean || true

          flutter create \
            --platforms=android \
            --project-name=milliy_ai \
            .

      - name: Configure Android
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          GRADLE_FILE="android/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "XATO: $GRADLE_FILE topilmadi!"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # compileSdk 36
          s = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              s
          )

          if 'compileSdk = 36' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    compileSdk = 36',
                  1
              )

          # NDK 27
          if 'ndkVersion' in s:
              s = re.sub(
                  r'ndkVersion\s*=\s*["\'][^"\']+["\']',
                  'ndkVersion = "27.0.12077973"',
                  s
              )
          else:
              s = s.replace(
                  'android {',
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          # minSdk 24
          s = re.sub(
              r'minSdk\s*=\s*\d+',
              'minSdk = 24',
              s
          )

          s = re.sub(
              r'minSdkVersion\s*=?\s*\d+',
              'minSdk = 24',
              s
          )

          if 'minSdk = 24' not in s:
              s = s.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        minSdk = 24',
                  1
              )

          p.write_text(s)
          PY

          echo "Android konfiguratsiyasi:"
          grep -E "compileSdk|minSdk|ndkVersion" android/app/build.gradle.kts || true

      - name: Get dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos || true

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "XATO: APK yaratilmagan!"
            find "$PROJECT_DIR/build" -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "APK tayyor:"
          ls -lh "$APK"

          mkdir -p final-apk
          cp "$APK" final-apk/MILLIY-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: final-apk/MILLIY-AI.apk
          if-no-files-found: error
          retention-days: 30
