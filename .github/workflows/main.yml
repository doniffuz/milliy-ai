name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Xavfsiz: workflow faqat repository tarkibini o'qiydi
permissions:
  contents: read

concurrency:
  group: milliy-ai-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # 3. ZIP ni avtomatik topish
      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "XATO: Repository ichida ZIP fayl topilmadi."
            echo "Mavjud fayllar:"
            ls -lah
            exit 1
          fi

          echo "Topilgan ZIP: $ZIP"

          unzip -o "$ZIP" -d app

          PUBSPEC="$(find app -type f -name pubspec.yaml | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "XATO: ZIP ichidan pubspec.yaml topilmadi."
            find app -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "Flutter project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Dart kodini formatlash
      - name: Check Dart source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

          echo "Dart format tekshirilmoqda..."

          dart format --output=none --set-exit-if-changed lib || true

          echo "Flutter project topildi:"
          pwd

      # 5. Android project yaratish
      - name: Prepare Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name=milliy_ai \
            .

      # 6. NDK 27
      - name: Configure Android NDK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "XATO: $FILE topilmadi."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          ndk = '    ndkVersion = "27.0.12077973"\n'

          if 'ndkVersion = "27.0.12077973"' not in s:
              if "android {" in s:
                  s = s.replace(
                      "android {\n",
                      "android {\n" + ndk,
                      1
                  )
              else:
                  raise SystemExit("android { bloki topilmadi")

          p.write_text(s)
          PY

          echo "NDK 27 sozlandi."

      # 7. Internet va mikrofon permission
      - name: Configure Android permissions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]

          marker = "<application"

          for permission in permissions:
              name = permission.split('"')[1]

              if name not in s:
                  s = s.replace(
                      marker,
                      permission + "\n" + marker,
                      1
                  )

          s = s.replace(
              'android:label="milliy_ai"',
              'android:label="MILLIY AI"'
          )

          p.write_text(s)
          PY

      # 8. Dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      # 9. Flutter source compile check
      - name: Analyze Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-infos

      # 10. Release APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # 11. APK ni saqlash
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7          echo "Topildi: $ZIP"

      - name: Extract project
        run: |
          set -e
          mkdir -p app
          unzip -o "$ZIP" -d app

      - name: Find Flutter project
        run: |
          set -e
          PUBSPEC=$(find app -name pubspec.yaml -type f | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml topilmadi!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf android
          flutter create --platforms=android --project-name=milliy_ai .

      - name: Set Android NDK 27
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
