name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MILLIY AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract MILLIY AI project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          ls -lah

          # Agar pubspec.yaml rootda bo'lsa, ZIP ochilmaydi.
          if [ -f "pubspec.yaml" ]; then
            echo "Root Flutter project topildi."
          else
            ZIP=""

            # Avval eng yangi to'liq loyiha ZIPlarini qidiramiz.
            for f in \
              "MILLIY_AI_GITHUB_BUILD_FIXED.zip" \
              "MILLIY_AI_FULL_FIREBASE_BUILD_READY.zip" \
              "MILLIY_AI_FULL_PROJECT-1.zip" \
              "MILLIY_AI_FULL_PROJECT.zip" \
              "MILLIY_AI_FIREBASE_READY_UPLOAD.zip"; do
              if [ -f "$f" ]; then
                ZIP="$f"
                break
              fi
            done

            # Yuqoridagi nomlar bo'lmasa, istalgan ZIPni topamiz.
            if [ -z "$ZIP" ]; then
              ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1 || true)"
            fi

            if [ -z "$ZIP" ]; then
              echo "XATO: Flutter loyiha ham, ZIP ham topilmadi."
              exit 1
            fi

            echo "Ochilyapti: $ZIP"

            rm -rf _milliy_project
            mkdir -p _milliy_project

            unzip -o "$ZIP" -d _milliy_project

            # ZIP ichidan pubspec.yaml joylashuvini topamiz.
            PUBSPEC="$(find _milliy_project -name pubspec.yaml -type f | head -n 1 || true)"

            if [ -z "$PUBSPEC" ]; then
              echo "XATO: ZIP ichidan pubspec.yaml topilmadi."
              echo "ZIP tarkibi:"
              find _milliy_project -maxdepth 4 -type f | sort | head -200
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"

            echo "Flutter project: $PROJECT_DIR"

            # Flutter projectni repository rootiga chiqaramiz.
            cp -a "$PROJECT_DIR"/. .

            # ZIP ichidagi google-services.jsonni ham qidiramiz.
            if [ ! -f "google-services.json" ]; then
              JSON="$(find _milliy_project -name google-services.json -type f | head -n 1 || true)"

              if [ -n "$JSON" ]; then
                cp "$JSON" ./google-services.json
                echo "google-services.json topildi."
              fi
            fi

            rm -rf _milliy_project

            if [ ! -f "pubspec.yaml" ]; then
              echo "XATO: loyiha chiqarilgandan keyin pubspec.yaml topilmadi."
              exit 1
            fi
          fi

          echo "===== Project files ====="
          ls -lah
          echo "========================="

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          # Android papkasi to'liq bo'lmasa Flutter uni yaratadi.
          # Eski nosoz Android konfiguratsiyasini ishlatmaslik uchun qayta yaratamiz.
          rm -rf android

          flutter create \
            --platforms=android \
            --project-name=milliy_ai \
            --org=com.example \
            .

      - name: Install Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "google-services.json" ]; then
            echo "XATO: google-services.json topilmadi."
            echo "Fayl repository rootida yoki loyiha ZIP ichida bo'lishi kerak."
            exit 1
          fi

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          echo "Firebase google-services.json o'rnatildi."

      - name: Configure Android SDK and Firebase
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------
          # android/settings.gradle.kts
          # -----------------------------
          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()

          if "com.google.gms.google-services" not in s:
              if "plugins {" in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
              else:
                  s = (
                      'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n'
                      'plugins {\n'
                      '    id("com.google.gms.google-services") version "4.4.2" apply false\n'
                      '}\n'
                      + s
                  )

          settings.write_text(s)

          # -----------------------------
          # android/app/build.gradle.kts
          # -----------------------------
          app = Path("android/app/build.gradle.kts")
          s = app.read_text()

          # Google Services plugin
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          # compileSdk = 36
          if re.search(r"compileSdk\s*=", s):
              s = re.sub(
                  r"compileSdk\s*=\s*[^\n]+",
                  "compileSdk = 36",
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    compileSdk = 36",
                  1
              )

          # minSdk = 24
          if re.search(r"minSdk\s*=", s):
              s = re.sub(
                  r"minSdk\s*=\s*[^\n]+",
                  "minSdk = 24",
                  s,
                  count=1
              )
          elif re.search(r"minSdkVersion\s+", s):
              s = re.sub(
                  r"minSdkVersion\s+[^\n]+",
                  "minSdkVersion 24",
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        minSdk = 24",
                  1
              )

          # NDK 27
          if re.search(r"ndkVersion\s*=", s):
              s = re.sub(
                  r'ndkVersion\s*=\s*["\'][^"\']+["\']',
                  'ndkVersion = "27.0.12077973"',
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "android {",
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          app.write_text(s)

          print("Android konfiguratsiyasi tayyor.")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json

          echo "Firebase JSON:"
          grep -E '"project_id"|"package_name"' \
            android/app/google-services.json || true

      - name: Generate SHA-1
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "MILLIY AI SHA-1 / SHA-256"
          echo "========================================"

          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              | grep -E "SHA1:|SHA256:" || true
          else
            echo "debug.keystore hali mavjud emas."
          fi

          echo "========================================"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "XATO: APK yaratilmagan."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD MUVAFFAQIYATLI"
          echo "========================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
