              s = s.replace(
                  "android {\n",
                  'android {\n    ndkVersion = "27.0.12077973"\n',
                  1
              )
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
