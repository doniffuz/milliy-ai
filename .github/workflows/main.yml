name: Build MILLIY AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milliy-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pubspec.yaml ]; then
            echo "Flutter project found in repository root."
          else
            rm -rf _flutter_project
            mkdir -p _flutter_project

            FOUND=""
            while IFS= read -r -d '' ZIP; do
              rm -rf _flutter_project/*
              unzip -oq "$ZIP" -d _flutter_project || continue
              FOUND="$(find _flutter_project -type f -name pubspec.yaml -print -quit || true)"
              if [ -n "$FOUND" ]; then
                break
              fi
            done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0 | sort -z)

            if [ -z "$FOUND" ]; then
              echo "XATO: repository rootda pubspec.yaml topilmadi va mos Flutter ZIP topilmadi."
              echo "Repository tarkibi:"
              find . -maxdepth 2 -type f -print | sort
              exit 1
            fi

            ROOT="$(dirname "$FOUND")"
            cp -a "$ROOT"/. .
            rm -rf _flutter_project
          fi

          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project ready."

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=milliy_ai --org=com.milliyai .
          fi
          rm -rf test

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text(encoding='utf-8')

          # flutter_tts >= 4.2.x requires SDK 36 and Android API 24+.
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)

          if re.search(r'ndkVersion\s*=\s*[^\n]+', s):
              s = re.sub(r'ndkVersion\s*=\s*[^\n]+', 'ndkVersion = "27.0.12077973"', s, count=1)
          else:
              s = s.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"', 1)

          if re.search(r'minSdk\s*=\s*[^\n]+', s):
              s = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 24', s, count=1)
          elif re.search(r'minSdkVersion\s+[^\n]+', s):
              s = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 24', s, count=1)
          else:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        minSdk = 24', 1)

          gradle.write_text(s, encoding='utf-8')
          PY

      - name: Get dependencies
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${API_BASE_URL:-https://YOUR-BACKEND.example/api}"
          flutter build apk --release --dart-define=API_BASE_URL="$URL"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
