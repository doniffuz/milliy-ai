name: Build MILLIY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MILLIY AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ ZIP topilmadi!"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "✅ ZIP topildi: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app

          unzip -o "$ZIP_PATH" -d app

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find app -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml topilmadi!"
            find app -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter loyiha: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name=milliy_ai \
            .

      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # compileSdk 36
          s = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              s
          )

          if 'compileSdk = 36' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    compileSdk = 36',
                  1
              )

          # NDK 27
          s = re.sub(
              r'ndkVersion\s*=\s*["\'][^"\']+["\']',
              'ndkVersion = "27.0.12077973"',
              s
          )

          if 'ndkVersion = "27.0.12077973"' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          # minSdk 24
          s = re.sub(
              r'minSdk\s*=\s*\d+',
              'minSdk = 24',
              s
          )

          s = re.sub(
              r'minSdkVersion\s+\d+',
              'minSdk = 24',
              s
          )

          if 'minSdk = 24' not in s:
              s = s.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        minSdk = 24',
                  1
              )

          p.write_text(s)

          print("✅ compileSdk = 36")
          print("✅ ndkVersion = 27.0.12077973")
          print("✅ minSdk = 24")
          PY

      - name: Remove old tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -rf test

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK yaratilmagan!"
            exit 1
          fi

          echo "===================================="
          echo "✅ MILLIY AI APK TAYYOR"
          echo "===================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
