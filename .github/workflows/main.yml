name: Build MILLIY AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP fayl topilmadi!"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d app

          echo "ZIP ochildi."

      - name: Find Flutter project
        id: flutter_project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find app -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml topilmadi!"
            find app -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Prepare Android
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            echo "Android papka mavjud."
          else
            flutter create --platforms=android .
          fi

      - name: Set Android NDK
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            if grep -q 'ndkVersion' "$FILE"; then
              sed -i 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' "$FILE"
            else
              sed -i '/android {/a\    ndkVersion = "27.0.12077973"' "$FILE"
            fi
          fi

      - name: Install dependencies
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILLIY-AI-APK
          path: ${{ steps.flutter_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
